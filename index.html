<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel de Juegos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #121212; color: #fff; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Barra de navegación superior */
        .navbar {
            background: #1f1f1f;
            width: 100%;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #333;
            z-index: 10;
        }
        .nav-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            margin: 0 5px;
            max-width: 120px;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: #ff6b81; }
        
        /* Contenedor de las páginas */
        .content-container {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #181818;
            padding: 20px;
            text-align: center;
        }
        .page.active { display: flex; }

        /* Estilo para el botón de juego dentro de la pestaña */
        .game-launch-btn {
            background: #2ed573;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .game-launch-btn:hover { background: #26af5f; }
    </style>
</head>
<body>

    <!-- Botones de navegación superiores -->
    <div class="navbar">
        <button class="nav-btn" onclick="cambiarPagina('inicio')">Inicio</button>
        <button class="nav-btn" onclick="cambiarPagina('juego')">Juego</button>
        <button class="nav-btn" onclick="cambiarPagina('ajustes')">Ajustes</button>
    </div>

    <!-- Contenido de las secciones -->
    <div class="content-container">
        <!-- Página de Inicio -->
        <div id="inicio" class="page active">
            <h2>Bienvenido a tu Panel Principal</h2>
            <p style="color: #aaa; margin-top: 10px;">Toca la pestaña "Juego" arriba para iniciar.</p>
        </div>

        <!-- Página de Juego (Aquí está el botón que activa el Intent en Sketchware) -->
        <div id="juego" class="page">
            <h2>Dofus Touch</h2>
            <p style="color: #aaa; margin-top: 10px;">Presiona el botón para abrir el juego nativo:</p>
            <!-- Este enlace especial será interceptado por Sketchware -->
            <a href="javascript:void(0);" onclick="window.location.href='dofus://abrir';" class="game-launch-btn">🎮 Jugar Dofus Touch</a>
        </div>

        <!-- Página de Ajustes -->
        <div id="ajustes" class="page">
            <h2>Configuración de la App</h2>
        </div>
    </div>

    <script>
        function cambiarPagina(idPagina) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            const target = document.getElementById(idPagina);
            if (target) {
                target.classList.add('active');
            }
        }
    </script>
</body>
</html>
