<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel de Juegos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #121212; color: #fff; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Barra de navegación superior con botones */
        .navbar {
            background: #1f1f1f;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-bottom: 2px solid #333;
            z-index: 10;
        }
        .nav-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: #ff6b81; }
        
        /* Contenedor de las páginas o contenidos */
        .content-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #181818;
        }
        .page.active { display: flex; }

        /* Estilo para el contenedor del juego a pantalla completa dentro de la pestaña */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Botones de navegación integrados -->
    <div class="navbar">
        <button class="nav-btn" onclick="cambiarPagina('inicio')">Inicio</button>
        <button class="nav-btn" onclick="cambiarPagina('juego')">Juego</button>
        <button class="nav-btn" onclick="cambiarPagina('ajustes')">Ajustes</button>
    </div>

    <!-- Contenido de las secciones -->
    <div class="content-container">
        <!-- Página de Inicio -->
        <div id="inicio" class="page active">
            <h2>Bienvenido a tu Panel Principal</h2>
            <p style="color: #aaa; margin-top: 10px;">Selecciona "Juego" en la barra superior.</p>
        </div>

        <!-- Página de Juego (Dofus Touch embebido) -->
        <div id="juego" class="page">
            <!-- Aquí puedes cambiar el enlace 'src' por la dirección web oficial del cliente de Dofus Touch o el juego web que desees -->
            <iframe class="game-frame" src="https://www.dofustouch.com/" allowfullscreen></iframe>
        </div>

        <!-- Página de Ajustes -->
        <div id="ajustes" class="page">
            <h2>Configuración de la App</h2>
        </div>
    </div>

    <script>
        // Función de JavaScript para alternar entre pantallas de forma fluida
        function cambiarPagina(idPagina) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            const target = document.getElementById(idPagina);
            if (target) {
                target.classList.add('active');
            }
        }
    </script>
</body>
</html>
